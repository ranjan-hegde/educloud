# ---------- Production profile ----------
# Activated via SPRING_PROFILES_ACTIVE=prod

# Disable auto-seeding in production
app.seed.enabled=${SEED_ENABLED:false}

# Default to 'update' so first-time deploys create tables automatically; set DDL_AUTO=validate once schema is stable
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Don't dump SQL to stdout in prod
spring.jpa.show-sql=false

# Render assigns a dynamic port via $PORT
server.port=${PORT:8080}

