# ---------- Production profile ----------
# Activated via SPRING_PROFILES_ACTIVE=prod

# Disable auto-seeding in production
app.seed.enabled=${SEED_ENABLED:false}

# Use 'validate' so Hibernate checks schema but doesn't auto-modify tables
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Don't dump SQL to stdout in prod
spring.jpa.show-sql=false

# Render assigns a dynamic port via $PORT
server.port=${PORT:8080}

